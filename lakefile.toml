name = "BruckFormalization"
defaultTargets = ["Bruck", "Challenge", "Solution", "verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "Bruck"
globs = ["Bruck.*"]
moreLeanArgs = ["-j1", "-M4096"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "verification"
roots = ["verification.Audit"]
